name: Run CI firestore node test
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo_support/workflow_ci_firestore_test
    steps:
      - name: Setup dart
        uses: tekartik/ci.dart/.github/actions/setup_ci_dart@v1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run firestore node test
        run: dart run tool/run_ci.dart
        env:
          TEKARTIK_FIREBASE_NODE_TEST_SERVICE_ACCOUNT: ${{ secrets.TEKARTIK_FIREBASE_NODE_TEST_SERVICE_ACCOUNT }}
          TEKARTIK_FIRESTORE_NODE_TEST_ROOT_COLLECTION_PATH: ${{ secrets.TEKARTIK_FIRESTORE_NODE_TEST_ROOT_COLLECTION_PATH }}
