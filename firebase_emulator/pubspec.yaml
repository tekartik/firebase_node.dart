name: tekartik_firebase_emulator
description: Firebase emulator helper
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  # Holds the whole implementation, this package is only its entry point.
  # Not tekartik_firebase_tools: the emulator needs no admin sdk, and this
  # package is depended on by flutter apps that only want the emulator helper.
  tekartik_firebase_tools_common:
    git:
      url: https://github.com/tekartik/firebase_tools.dart
      path: packages/firebase_tools_common
dev_dependencies:
  # Used by the examples and the tools, not by lib/.
  dev_build: ">=1.1.8+2"
  lints: ">=6.1.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"

resolution: workspace
